set_heating_curve:
  name: Set heating curve
  description: Set the heating curve parameters of a climate zone.
  target:
    entity:
      domain: climate
  fields:
    slope:
      name: Slope
      description: Slope of the heating curve.
      required: true
      example: 0.9
      selector:
        number:
          min: 0
          max: 4
          step: 0.1
    base_setpoint:
      name: Base setpoint
      description: Base setpoint temperature of the heating curve in degrees Celsius.
      required: true
      example: 34
      selector:
        number:
          min: 10
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
